[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-maf-agent-runtime"
version = "0.2.0"
description = "Standalone Microsoft Agent Framework invocation runtime"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.26.0",
    "agent-framework-openai==1.18.2",
    "httpx2==2.16.2",
    "openai==3.60.0",
    "pydantic==2.14.4",
]

[project.scripts]
maf-agent = "agent_runtime.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
dependencies = ["mypy>=1.19,<2", "pytest>=9,<10", "ruff>=0.16,<0.17"]

[tool.hatch.envs.default.scripts]
run = "maf-agent {args}"
smoke = "maf-agent --smoke {args}"
calibrate = "python -m calibration {args}"
test = "pytest {args:tests}"
check = ["ruff check src calibration tests", "ruff format --check src calibration tests"]
types = "mypy --strict src calibration"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
