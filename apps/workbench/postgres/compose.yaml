name: rag-workbench

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench_admin
      POSTGRES_PASSWORD: ${WORKBENCH_DB_ADMIN_PASSWORD:?Generate the local environment first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench_admin -d workbench"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 30s

volumes:
  postgres_data:
